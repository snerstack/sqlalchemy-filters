[tox]
envlist = {py310,py311,py312}-sqlalchemy{2.0,latest}
skipsdist = True

[testenv]
whitelist_externals = make
usedevelop = true
extras =
    dev
    mysql
    postgresql
deps =
    {py310,py311,py312}: sqlalchemy-utils~=0.41.2
    sqlalchemy2.0: sqlalchemy>=2.0,<2.1
commands =
    make coverage ARGS='-x -vv'
